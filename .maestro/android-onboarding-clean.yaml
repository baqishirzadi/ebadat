appId: com.afghandev.ebadat
---
# Pixel 7 / Android 12+: the only first-run Adhan setup screens are
# notifications, exact alarms, and battery optimization.
- launchApp:
    clearState: true
    permissions:
      notifications: allow
      location: allow
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible:
      text: "به عبادت خوش آمدید"
    timeout: 25000
- tapOn:
    text: "شروع"
- extendedWaitUntil:
    visible:
      text: "زبان برنامه"
    timeout: 15000
- tapOn:
    text: "ادامه"
- extendedWaitUntil:
    visible:
      text: "انتخاب کشور و شهر"
    timeout: 15000
- tapOn:
    text: "جستجوی همه شهرها"
- scrollUntilVisible:
    element:
      text: "کابل"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "کابل"
- tapOn:
    text: "ادامه با کابل"
- extendedWaitUntil:
    visible:
      id: "android-onboarding-notifications"
    timeout: 15000
- assertNotVisible: "فعال کردن «شروع خودکار»"
- tapOn:
    text: "اجازه دادن"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "ALLOW"
    optional: true
- extendedWaitUntil:
    visible:
      id: "android-onboarding-exact-alarms"
    timeout: 15000
- assertNotVisible: "شروع خودکار"
- tapOn:
    text: "فعلاً نه"
    optional: true
- tapOn:
    text: "ادامه"
    optional: true
- extendedWaitUntil:
    visible:
      id: "android-onboarding-battery"
    timeout: 15000
- assertNotVisible: "شروع خودکار"
- tapOn:
    text: "بعداً"
    optional: true
- tapOn:
    text: "ادامه"
    optional: true
- extendedWaitUntil:
    visible:
      text: "مفتی هوشمند حنفی"
    timeout: 40000
- assertNotVisible: "شروع خودکار"
- scrollUntilVisible:
    element:
      id: "adhan-status-card"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "adhan-status-card"
- extendedWaitUntil:
    visible:
      id: "android-adhan-health"
    timeout: 15000
- assertNotVisible: "Console Error"
- assertNotVisible: "Console Warning"
- takeScreenshot: android-onboarding-clean
