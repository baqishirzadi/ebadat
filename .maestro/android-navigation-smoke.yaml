appId: com.afghandev.ebadat
---
# Preconditions: device unlocked, app onboarded. Run `adb shell wm dismiss-keyguard` first on Samsung.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "بیشتر"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "ios-more-ready"
    timeout: 30000
- takeScreenshot: android-nav-more-tab
- scrollUntilVisible:
    element:
      text: "احادیث"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "احادیث"
- extendedWaitUntil:
    visible:
      id: "ios-ahadith-ready"
    timeout: 15000
- takeScreenshot: android-nav-ahadith
- back
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "بیشتر"
- extendedWaitUntil:
    visible:
      id: "ios-more-ready"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "اذکار"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "اذکار"
- extendedWaitUntil:
    visible:
      text: "اذکار پرکاربرد"
    timeout: 15000
- takeScreenshot: android-nav-adhkar
- back
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "بیشتر"
- extendedWaitUntil:
    visible:
      id: "ios-more-ready"
    timeout: 15000
- tapOn:
    text: "خانه"
- extendedWaitUntil:
    visible:
      text: "این تاریخ امروز است"
    timeout: 15000
- takeScreenshot: android-nav-home
- tapOn:
    text: "قرآن"
- extendedWaitUntil:
    visible:
      text: "قرآن"
    timeout: 15000
- takeScreenshot: android-nav-quran
- tapOn:
    text: "جنتری"
- extendedWaitUntil:
    visible:
      text: "جنتری"
    timeout: 15000
- takeScreenshot: android-nav-jantari
- tapOn:
    text: "نعت"
- extendedWaitUntil:
    visible:
      id: "naat-screen-list"
    timeout: 20000
- takeScreenshot: android-nav-naat
- tapOn:
    text: "بیشتر"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "ios-more-ready"
    timeout: 15000
- takeScreenshot: android-nav-more-final
