appId: com.afghandev.ebadat
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "مفتی هوشمند حنفی"
    timeout: 40000
- scrollUntilVisible:
    element:
      id: "adhan-status-card"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "adhan-status-card"
- extendedWaitUntil:
    visible:
      id: "ios-adhan-settings-ready"
    timeout: 10000
- assertNotVisible: "Console Error"
- takeScreenshot: ios-adhan-status-card-route
